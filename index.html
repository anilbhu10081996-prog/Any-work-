<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyWork.com — गाँव से World Level तक</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{padding:15px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}.nav,.wrap{max-width:1150px;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;color:#1565d8}.hero{background:linear-gradient(135deg,#0645ad,#2584ed);color:white;padding:65px 18px}.hero h1{font-size:clamp(38px,6vw,65px);max-width:800px}.wrap{padding:35px 18px}.search{background:white;padding:8px;border-radius:12px;display:flex;gap:8px;max-width:800px}.search input,.search select{padding:13px;border:0;flex:1}.btn{padding:11px 16px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#1565d8;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.products{margin-top:18px}.product img,.product video{width:100%;height:190px;object-fit:cover;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.box{background:white;padding:22px;border-radius:15px;width:min(520px,100%)}form{display:grid;gap:11px}input,select,textarea{padding:12px;border:1px solid #ccd3df;border-radius:8px}.msg{padding:10px;background:#eef6ff;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body><header><div class="nav"><div class="logo">AnyWork.com</div><div><button class="btn" onclick="openM('login')">Login</button><button class="btn primary" onclick="openM('signup')">Register</button></div></div></header><section class="hero"><div class="wrap"><b>गाँव से World Level तक 🌍</b><h1>काम चाहिए या काम देना है?</h1><p>Workers, services, shops और products को customers से जोड़ने वाला real marketplace.</p><div class="search"><input id="q" placeholder="Electrician, Plumber, कपड़े..." oninput="loadProducts()"><select id="cat" onchange="loadProducts()"><option value="">सभी Categories</option><option>Electronics</option><option>Grocery</option><option>Fashion</option><option>Home Service</option><option>Education</option></select><button class="btn primary" onclick="loadProducts()">Search</button></div></div></section><main class="wrap"><h2>Popular Services</h2><div class="grid"><div class="card">⚡<h3>Electrician</h3></div><div class="card">🔧<h3>Plumber</h3></div><div class="card">📚<h3>Teacher</h3></div><div class="card">🏠<h3>Home Service</h3></div></div><h2 style="margin-top:40px">Latest Products</h2><button class="btn primary" onclick="openM('product')">+ Add Product</button><div id="products" class="grid products"></div></main><div id="login" class="modal"><div class="box"><button onclick="closeM('login')">✕</button><h2>Login</h2><form onsubmit="login(event)"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button class="btn primary">Login</button><div id="lm"></div></form></div></div><div id="signup" class="modal"><div class="box"><button onclick="closeM('signup')">✕</button><h2>Create Account</h2><form onsubmit="signup(event)"><input id="name" placeholder="पूरा नाम" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Mobile"><select id="role"><option value="customer">Customer</option><option value="worker">Worker</option><option value="seller">Shopkeeper/Seller</option></select><input id="pass" type="password" placeholder="Password" required><button class="btn primary">Create Account</button><div id="sm"></div></form></div></div><div id="product" class="modal"><div class="box"><button onclick="closeM('product')">✕</button><h2>Add Product</h2><form onsubmit="addProduct(event)"><input id="pn" placeholder="Product name" required><select id="pc"><option>Electronics</option><option>Grocery</option><option>Fashion</option><option>Home Service</option><option>Education</option></select><textarea id="pd" placeholder="Details"></textarea><input id="price" type="number" placeholder="Price" required><input id="mrp" type="number" placeholder="MRP"><input id="stock" type="number" placeholder="Stock"><input id="loc" placeholder="Location"><input id="img" type="file" accept="image/*"><input id="vid" type="file" accept="video/*"><button class="btn primary">Save Product</button><div id="pm"></div></form></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://ijnqwlinfgznavhachhb.supabase.co',KEY='sb_publishable_DypR578Ny2vGlP1Afkgn5A_-XvcLwKg';const sb=URL.startsWith('PASTE_')?null:createClient(URL,KEY);const $=x=>document.getElementById(x);window.openM=x=>$(x).classList.add('show');window.closeM=x=>$(x).classList.remove('show');function message(id,t){$(id).innerHTML='<div class="msg">'+t+'</div>'}window.signup=async e=>{e.preventDefault();if(!sb)return message('sm','index.html में Supabase URL और Publishable Key डालें।');let{data,error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value});if(error)return message('sm',error.message);if(data.user)await sb.from('profiles').upsert({id:data.user.id,full_name:$('name').value,phone:$('phone').value,role:$('role').value});message('sm','Account बन गया। Email verification माँगी जाए तो email verify करें।')};window.login=async e=>{e.preventDefault();if(!sb)return message('lm','पहले Supabase keys डालें।');let{error}=await sb.auth.signInWithPassword({email:$('le').value,password:$('lp').value});if(error)return message('lm',error.message);closeM('login');loadProducts()};window.addProduct=async e=>{e.preventDefault();if(!sb)return message('pm','Supabase connect करने के बाद real product save होगा।');let{data:u}=await sb.auth.getUser();if(!u.user)return message('pm','पहले Login करें।');let{data:p,error}=await sb.from('products').insert({owner_id:u.user.id,name:$('pn').value,category:$('pc').value,description:$('pd').value,price:Number($('price').value),mrp:$('mrp').value?Number($('mrp').value):null,stock:Number($('stock').value||0),location:$('loc').value}).select().single();if(error)return message('pm',error.message);for(const [f,type] of [[$('img').files[0],'image'],[$('vid').files[0],'video']]){if(!f)continue;let path=u.user.id+'/'+p.id+'/'+crypto.randomUUID()+'-'+f.name;let up=await sb.storage.from('product-media').upload(path,f);if(up.error)return message('pm',up.error.message);await sb.from('product_media').insert({product_id:p.id,owner_id:u.user.id,media_type:type,storage_path:path})}closeM('product');e.target.reset();loadProducts()};window.loadProducts=async()=>{if(!sb){$('products').innerHTML='<div class="card">Supabase connect करने के बाद यहाँ real products आएँगे.</div>';return}let{data,error}=await sb.from('products').select('*,product_media(*)').eq('active',true).order('created_at',{ascending:false});if(error)return message('products',error.message);let q=$('q').value.toLowerCase(),c=$('cat').value;data=data.filter(x=>(!q||(x.name+' '+(x.category||'')+' '+(x.location||'')).toLowerCase().includes(q))&&(!c||x.category===c));$('products').innerHTML=data.map(x=>{let m=(x.product_media||[])[0],v='📦';if(m){let u=sb.storage.from('product-media').getPublicUrl(m.storage_path).data.publicUrl;v=m.media_type==='image'?`<img src="${u}">`:`<video src="${u}" controls></video>`}return`<div class="card product">${v}<h3>${x.name}</h3><p>${x.category||''}</p><b>₹${Number(x.price).toLocaleString('en-IN')}</b></div>`}).join('')||'<div class="card">कोई product नहीं मिला।</div>'};loadProducts();</script></body></html>
