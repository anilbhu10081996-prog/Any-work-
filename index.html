<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANY WORK | हर काम के लिए सही व्यक्ति</title>
<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.5
}

header{
position:sticky;
top:0;
z-index:100;
background:#fff;
box-shadow:0 2px 12px #0002
}

.nav{
max-width:1200px;
margin:auto;
padding:12px 16px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.logo{
font-size:25px;
font-weight:900;
color:#1565d8
}

nav{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:center
}

nav a{
text-decoration:none;
color:#172033;
padding:8px 10px;
border-radius:8px;
font-weight:bold;
font-size:14px
}

nav a:hover{
background:#eef4ff;
color:#1565d8
}

.hero{
background:linear-gradient(135deg,#0645ad,#2584ed);
color:#111827;
padding:65px 18px
}

.wrap{
max-width:1200px;
margin:auto;
padding:0 18px
}

.hero h1{
font-size:clamp(35px,6vw,65px);
line-height:1.1;
margin:15px 0
}

.hero p{
font-size:18px;
max-width:750px
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:22px
}

.btn{
border:0;
border-radius:10px;
padding:11px 17px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:inline-block
}

.primary{background:#1565d8;color:#111827}
.green{background:#16a34a;color:#111827}
.orange{background:#f97316;color:#111827}
.red{background:#dc2626;color:#111827}
.dark{background:#172033;color:#111827}
.light{background:#eef4ff;color:#1565d8}
.whiteBtn{background:#fff;color:#1565d8}

.searchBox{
background:#fff;
padding:10px;
border-radius:14px;
display:flex;
gap:8px;
margin-top:25px;
max-width:900px
}

.searchBox input,
.searchBox select{
border:0;
outline:0;
padding:13px;
flex:1;
min-width:0
}

section{
padding:55px 0
}

.sectionTitle{
text-align:center;
margin-bottom:28px
}

.sectionTitle h2{
font-size:32px;
margin:0 0 8px
}

.sectionTitle p{
color:#667085
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}

.card{
background:#fff;
border:1px solid #e2e6ee;
border-radius:16px;
padding:20px;
box-shadow:0 4px 15px #00000008
}

.card h3{
margin-top:5px
}

.cardIcon{
font-size:35px
}

.serviceCard{
cursor:pointer;
transition:.2s
}

.serviceCard:hover{
transform:translateY(-3px);
box-shadow:0 8px 22px #0002
}

.status{
padding:12px;
border-radius:10px;
background:#eef4ff;
margin-bottom:15px
}

.productsGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}

.product img,
.product video{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
background:#eee
}

.price{
font-size:20px;
font-weight:bold;
color:#0f766e
}

.muted{
color:#667085
}

.actions{
display:flex;
gap:8px;
margin-top:14px;
flex-wrap:wrap
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:500;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.box{
background:#fff;
width:min(550px,100%);
max-height:90vh;
overflow:auto;
border-radius:18px;
padding:24px;
position:relative
}

.close{
position:absolute;
right:14px;
top:12px;
border:0;
background:#eee;
border-radius:50%;
width:35px;
height:35px;
cursor:pointer;
font-size:18px
}

form{
display:grid;
gap:11px
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccd3df;
border-radius:9px;
font-size:15px;
font-family:inherit
}

textarea{
resize:vertical
}

.msg{
padding:11px;
margin-top:8px;
border-radius:9px;
background:#ecfdf3;
color:#166534
}

.msg.error{
background:#fef2f2;
color:#991b1b
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#eef4ff;
color:#1565d8;
font-size:12px;
font-weight:bold
}

.flow{
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center
}

.flow .card{
flex:1;
min-width:180px;
text-align:center
}

footer{
background:#172033;
color:#111827;
padding:35px 18px;
text-align:center
}

@media(max-width:900px){
.grid,
.productsGrid{
grid-template-columns:repeat(2,1fr)
}

nav{
display:none
}
}

@media(max-width:550px){
.grid,
.productsGrid{
grid-template-columns:1fr
}

.searchBox{
flex-direction:column
}

.hero{
padding:45px 10px
}

.buttons .btn{
width:100%;
text-align:center
}
}

/* =========================
   PROFESSIONAL LAYOUT ADDITIONS
========================= */
:root{
  --brand:#1565d8;
  --brand-dark:#0645ad;
  --text:#172033;
  --muted:#667085;
  --surface:#fff;
  --line:#e2e6ee;
  --soft:#f5f7fb;
}
.sectionAlt{background:#fff}
.featureIcon{
  width:54px;height:54px;border-radius:14px;
  display:grid;place-items:center;font-size:28px;
  background:#eef4ff;margin-bottom:12px
}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  margin-top:-28px;position:relative;z-index:2
}
.statCard{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:20px;text-align:center;box-shadow:0 8px 25px #0000000d
}
.statCard strong{display:block;font-size:28px;color:var(--brand)}
.statCard span{color:var(--muted);font-size:14px}
.steps{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px
}
.stepNum{
  width:42px;height:42px;border-radius:50%;background:var(--brand);
  color:#111827;display:grid;place-items:center;font-weight:900;margin:0 auto 12px
}
.testimonials{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px
}
.quote{font-size:17px}
.stars{letter-spacing:2px;margin-bottom:8px}
.aboutGrid{
  display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center
}
.aboutPanel{
  background:linear-gradient(135deg,#eef4ff,#fff);border:1px solid var(--line);
  border-radius:20px;padding:26px
}
.checkList{list-style:none;padding:0;margin:18px 0}
.checkList li{margin:10px 0}
.faq{max-width:850px;margin:auto}
.faq details{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:15px 18px;margin:10px 0
}
.faq summary{cursor:pointer;font-weight:800}
.contactGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px
}
.contactCard{text-align:center}
.footerLinks{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:16px 0
}
.footerLinks a{color:#111827;text-decoration:none;opacity:.9}
.footerLinks a:hover{opacity:1;text-decoration:underline}
.mobileMenuBtn{display:none}
.navOpen nav{display:flex!important}
@media(max-width:900px){
  .stats,.steps{grid-template-columns:repeat(2,1fr)}
  .testimonials{grid-template-columns:1fr}
  .aboutGrid{grid-template-columns:1fr}
  .contactGrid{grid-template-columns:1fr}
  .mobileMenuBtn{display:inline-block}
  header .nav{position:relative}
  header nav{
    position:absolute;left:12px;right:12px;top:64px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px;box-shadow:0 10px 30px #0002;flex-direction:column
  }
  header nav a{display:block}
}
@media(max-width:550px){
  .stats,.steps{grid-template-columns:1fr}
  .statCard strong{font-size:24px}
  .sectionTitle h2{font-size:27px}
}

.danger{background:#dc2626;color:#111827;border:0;border-radius:10px;padding:11px 17px;font-weight:bold;cursor:pointer}
@media(max-width:550px){.aboutGrid h2{font-size:29px!important}}

/* ================= BLINKIT-STYLE DELIVERY ================= */

.deliveryHero p { font-size: 18px; color: #a16207; }
.deliverySteps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
.delStep { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; text-align: center; }
.delIcon { font-size: 40px; margin-bottom: 10px; }
.deliveryOrderBox { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 30px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
.deliveryOrderBox h3 { text-align: center; margin-top: 0; margin-bottom: 20px; }
